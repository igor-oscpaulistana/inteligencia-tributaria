[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legalizacao-agent"
version = "0.1.0"
description = "Agente de IA analista de legalização: da recepção de documentos ao protocolo do contrato social na JUCESP."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.8,<3",
    "pydantic>=2.6",
    "jinja2>=3.1",
    "python-docx>=1.1",
]

[project.optional-dependencies]
portal = ["playwright>=1.45"]
dev = ["pytest>=8"]

[project.scripts]
legalizacao = "legalizacao.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legalizacao = ["contrato/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
